<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Farmers · Farmer Carbon Tracker</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
    <nav>
        <span class="brand">🌱 CarbonKhet</span>
        <a href="/">Dashboard</a>
        <a href="/farmers.html" class="active">Farmers</a>
        <a href="/collections.html">Collections</a>
        <a href="/production.html">Production</a>
        <a href="/route.html">Route</a>
        <a href="/reports.html">Reports</a>
    </nav>

  <main>
    <h1>Farmer Registration</h1>

    <form id="farmer-form">
      <label>Name<input name="name" required /></label>
      <label>Village<input name="village" required /></label>
      <label>Acres<input name="acres" type="number" step="0.1" required /></label>
      <label>Crop<input name="crop" value="Cotton" required /></label>
      <label>GPS Lat<input name="gps_lat" type="number" step="any" /></label>
      <label>GPS Lng<input name="gps_lng" type="number" step="any" /></label>
      <button type="submit">Register Farmer</button>
    </form>

    <div class="card">
      <h2>Registered Farmers</h2>
      <table>
        <thead>
          <tr><th>ID</th><th>Name</th><th>Village</th><th>Acres</th><th>Crop</th><th>GPS</th></tr>
        </thead>
        <tbody id="farmer-rows"></tbody>
      </table>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/farmers.js"></script>
</body>
</html>
